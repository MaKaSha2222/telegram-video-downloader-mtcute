plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'space.manus.tgvidapp'
version = '1.0.0'

android {
  namespace 'expo.modules.localbotapi'
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
    minSdkVersion 24
    ndk {
      abiFilters 'arm64-v8a'
    }
    externalNativeBuild {
      cmake {
        cppFlags '-std=c++17 -fexceptions -fno-rtti'
        def opensslRoot = System.getenv('ANDROID_OPENSSL_ROOT') ?: ''
        arguments '-DANDROID_STL=c++_shared',
          "-DOPENSSL_ROOT_DIR=${opensslRoot}",
          "-DOPENSSL_INCLUDE_DIR=${opensslRoot}/include",
          "-DOPENSSL_CRYPTO_LIBRARY=${opensslRoot}/lib/libcrypto.a",
          "-DOPENSSL_SSL_LIBRARY=${opensslRoot}/lib/libssl.a",
          '-DOPENSSL_FOUND=TRUE',
          '-DCMAKE_CXX_FLAGS_RELWITHDEBINFO=-O2 -DNDEBUG -g0'
      }
    }
  }
  buildFeatures {
    prefab true
  }
  packagingOptions {
    jniLibs {
      excludes += ['**/libtdjson.so']
    }
  }
  externalNativeBuild {
    cmake {
      path 'src/main/cpp/CMakeLists.txt'
      version '3.22.1'
    }
  }
}
