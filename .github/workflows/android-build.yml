name: Native Android APK Build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

env:
  ANDROID_PLATFORM: android-35
  ANDROID_BUILD_TOOLS: 35.0.0
  ANDROID_CMAKE: 3.22.1
  ANDROID_NDK: 27.1.12297006

jobs:
  build-native-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager -print -quit)"
          "${SDKMANAGER}" "platform-tools" "platforms;${ANDROID_PLATFORM}" "build-tools;${ANDROID_BUILD_TOOLS}" "cmake;${ANDROID_CMAKE}" "ndk;${ANDROID_NDK}"
          yes | "${SDKMANAGER}" --licenses >/dev/null
      - name: Configure SDK path
        run: echo "sdk.dir=${ANDROID_HOME}" > android/local.properties
      - name: Build native release APK
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon --max-workers=2
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: telegram-video-downloader-native-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
