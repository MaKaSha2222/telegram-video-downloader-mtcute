name: Android APK Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Test and build ARM64 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;26.3.11579264"

      - name: Install Python test dependency
        run: python -m pip install -r requirements.txt

      - name: Run Telegram resolver tests
        run: PYTHONPATH=android/app/src/main/python python -m unittest discover -s tests -v

      - name: Install TDLib generator dependency
        run: sudo apt-get update && sudo apt-get install --yes gperf

      - name: Generate TDLib sources for Android cross-compilation
        run: |
          cmake -S vendor/telegram-bot-api/td -B build/tdlib-codegen \
            -DTD_GENERATE_SOURCE_FILES=ON \
            -DTD_ENABLE_JNI=OFF \
            -DTD_ENABLE_DOTNET=OFF \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build/tdlib-codegen --target prepare_cross_compiling --parallel 2

      - name: Build OpenSSL Crypto for Android ARM64
        run: |
          git clone --depth 1 --branch openssl-3.5.9 https://github.com/openssl/openssl.git build/openssl-src
          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/26.3.11579264"
          export PATH="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          cd build/openssl-src
          ./Configure android-arm64 -D__ANDROID_API__=24 --prefix="$GITHUB_WORKSPACE/build/openssl-install" no-shared no-ssl no-tests
          make -j2
          make install_sw

      - name: Build debug APK
        working-directory: android
        env:
          OPENSSL_ROOT_DIR: ${{ github.workspace }}/build/openssl-install
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: telegram-video-downloader-arm64-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
