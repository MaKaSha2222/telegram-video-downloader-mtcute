plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.chaquo.python'
}

android {
    namespace 'space.manus.tgvidapp.t145521605804137'
    compileSdk 35

    defaultConfig {
        applicationId 'space.manus.tgvidapp.t145521605804137'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
        ndkVersion '26.3.11579264'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake { arguments '-DANDROID_STL=c++_shared' }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    buildFeatures { buildConfig true }

    buildTypes {
        release {
            // Use the standard debug key so the GitHub Actions artifact is directly installable.
            signingConfig signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    packaging {
        // Compress the single ARM64 native library to keep the installable APK smaller.
        jniLibs { useLegacyPackaging = false }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }
}

chaquopy {
    defaultConfig {
        version = '3.12'
        buildPython 'python3.12'
        pip {
            // pyaes is bundled under src/main/python because PyPI publishes only an sdist.
            options '--no-deps'
            install 'Telethon==1.41.2'
            install 'rsa==4.9.1'
            install 'pyasn1==0.6.5'
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
}
