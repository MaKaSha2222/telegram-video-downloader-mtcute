plugins {
  id "com.android.application"
  id "org.jetbrains.kotlin.android"
  id "com.chaquo.python"
}

android {
  namespace "space.manus.tgvidapp"
  compileSdk 35
  ndkVersion "27.1.12297006"

  defaultConfig {
    applicationId "space.manus.tgvidapp"
    minSdk 24
    targetSdk 35
    versionCode 2
    versionName "2.0.0-native"
    ndk { abiFilters "arm64-v8a" }
    externalNativeBuild {
      cmake {
        cppFlags "-std=c++17", "-fexceptions", "-fno-rtti"
        arguments "-DANDROID_STL=c++_shared"
      }
    }
  }

  signingConfigs {
    debug {
      storeFile file("debug.keystore")
      storePassword "android"
      keyAlias "androiddebugkey"
      keyPassword "android"
    }
  }

  buildTypes {
    debug { signingConfig signingConfigs.debug }
    release {
      signingConfig signingConfigs.debug
      minifyEnabled false
      shrinkResources false
    }
  }

  externalNativeBuild {
    cmake {
      path file("../../modules/local-bot-api/android/src/main/cpp/CMakeLists.txt")
      version "3.22.1"
    }
  }

  packaging { resources.excludes += ["META-INF/INDEX.LIST", "META-INF/DEPENDENCIES"] }
}

chaquopy {
  defaultConfig {
    version = "3.11"
    pip { install "Telethon==1.42.0" }
  }
  sourceSets { getByName("main") { srcDir "../../python" } }
}

dependencies {
  implementation "androidx.core:core-ktx:1.15.0"
  implementation "androidx.appcompat:appcompat:1.7.0"
  implementation "com.google.android.material:material:1.12.0"
}
